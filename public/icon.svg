<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <!-- Background with rounded corners for maskable safe zone -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)" />
  
  <!-- Outer Shield Outline -->
  <path d="M256 64 C350 64 416 112 416 224 C416 352 288 432 256 448 C224 432 96 352 96 224 C96 112 162 64 256 64 Z" 
        fill="url(#shieldGrad)" opacity="0.25" />

  <!-- Inner Shield -->
  <path d="M256 88 C332 88 388 128 388 220 C388 328 280 398 256 414 C232 398 124 328 124 220 C124 128 180 88 256 88 Z" 
        fill="#ffffff" />

  <!-- Agronomic Leaf & Checkmark -->
  <path d="M256 140 C210 180 180 230 180 290 C180 340 216 370 256 370 C296 370 332 340 332 290 C332 230 302 180 256 140 Z" 
        fill="#059669" />
  
  <!-- Sprout Stem / Leaf vein -->
  <path d="M256 160 Q256 260 256 350" 
        stroke="#ffffff" stroke-width="12" stroke-linecap="round" />
  <path d="M256 230 Q225 210 210 240" 
        stroke="#ffffff" stroke-width="10" stroke-linecap="round" fill="none" />
  <path d="M256 270 Q287 250 302 280" 
        stroke="#ffffff" stroke-width="10" stroke-linecap="round" fill="none" />

  <!-- Audit Badge Circle -->
  <circle cx="360" cy="360" r="64" fill="#047857" stroke="#ffffff" stroke-width="12" />
  <!-- Checkmark -->
  <path d="M336 360 L352 376 L386 342" 
        stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none" />
</svg>
